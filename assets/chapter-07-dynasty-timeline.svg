<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">蒙古擴張、汗國分支與中國朝代</title><desc id="d">上軌顯示擴張期及金帳、伊兒、察合台、東察合台和帖木兒政權的時間帶，下軌顯示中國朝代，元朝位於南宋稍上方。虛線是分支或興起背景，不是同一王朝順序傳位。</desc><defs><linearGradient id="fade"><stop stop-color="#a6c5b4"/><stop offset="1" stop-color="#eff1e8"/></linearGradient><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#698274"/></marker></defs><rect width="1400" height="820" fill="#faf7ef"/><style>text{font-family:Microsoft JhengHei,Noto Sans TC,sans-serif;fill:#343330}.s{font-size:16px}.l{font-size:19px;font-weight:600}.h{font-size:23px;font-weight:600}</style><text x="45" y="40" class="h">蒙古擴張、汗國分支與中國朝代：共用年代刻度</text><path d="M280.0 80V720" stroke="#ddd8cd" stroke-dasharray="3 5"/><path d="M462.43697478991595 80V720" stroke="#ddd8cd" stroke-dasharray="3 5"/><path d="M548.7394957983194 80V720" stroke="#ddd8cd" stroke-dasharray="3 5"/><path d="M644.8739495798319 80V720" stroke="#ddd8cd" stroke-dasharray="3 5"/><path d="M725.7142857142857 80V720" stroke="#ddd8cd" stroke-dasharray="3 5"/><path d="M872.1008403361344 80V720" stroke="#ddd8cd" stroke-dasharray="3 5"/><path d="M1027.2268907563025 80V720" stroke="#ddd8cd" stroke-dasharray="3 5"/><path d="M1320.0 80V720" stroke="#ddd8cd" stroke-dasharray="3 5"/><text x="280.0" y="75" text-anchor="middle" class="s">960</text><text x="462.43697478991595" y="75" text-anchor="middle" class="s">1127</text><text x="725.7142857142857" y="75" text-anchor="middle" class="s">1368</text><text x="872.1008403361344" y="75" text-anchor="middle" class="s">1502</text><text x="1027.2268907563025" y="75" text-anchor="middle" class="s">1644</text><text x="1320.0" y="75" text-anchor="middle" class="s">1912</text><text x="45" y="115" class="h">蒙古世界及後續政權</text><rect x="548.7394957983194" y="139" width="515.6302521008403" height="30" fill="url(#fade)" rx="3"/><rect x="548.7394957983194" y="139" width="96.13445378151255" height="30" fill="#42675a" rx="3"/><text x="548.7394957983194" y="133" text-anchor="end" class="s">1206</text><text x="644.8739495798319" y="191" text-anchor="middle" class="s">1294</text><text x="759.8739495798319" y="160" class="s">各汗國與後續政權分別延續</text><text x="45" y="236" class="l">欽察／金帳汗國</text><text x="45" y="257" class="s">約1227–1502</text><rect x="571.6806722689075" y="218" width="300.4201680672269" height="28" rx="3" fill="#b9d1bf"/><text x="548.7394957983194" y="271" class="s">今日位置｜今俄羅斯南部、烏克蘭與哈薩克西部</text><text x="45" y="314" class="l">伊兒汗國</text><text x="45" y="335" class="s">1256–1353</text><rect x="603.3613445378151" y="296" width="105.96638655462198" height="28" rx="3" fill="#c3d2df"/><text x="548.7394957983194" y="349" class="s">今日位置｜今伊朗、伊拉克一帶</text><text x="45" y="392" class="l">帖木兒政權</text><text x="45" y="413" class="s">約1370–1507</text><rect x="727.8991596638656" y="374" width="149.6638655462184" height="28" rx="3" fill="#d6b5a6"/><text x="548.7394957983194" y="427" class="s">今日位置｜中心在今烏茲別克；延伸至伊朗、阿富汗</text><text x="45" y="470" class="l">察合台封地與汗國</text><text x="45" y="491" class="s">約1227起；14世紀分裂</text><rect x="571.6806722689075" y="452" width="131.09243697478996" height="28" rx="3" fill="#d8c9a9"/><text x="548.7394957983194" y="505" class="s">今日位置｜中亞：今烏茲別克等地，向東至新疆</text><text x="45" y="548" class="l">東察合台／蒙兀兒王國</text><text x="45" y="569" class="s">1347起；後續支系至17世紀</text><rect x="702.7731092436975" y="530" width="361.59663865546213" height="28" rx="3" fill="url(#fade)"/><text x="548.7394957983194" y="583" class="s">今日位置｜今新疆、吉爾吉斯與哈薩克東南部一帶</text><text x="45" y="610" class="s">關聯：察合台東部分支 → 蒙兀兒王國；西部河中地區 → 帖木兒興起的背景。</text><text x="45" y="648" class="h">中國朝代</text><rect x="280.0" y="700" width="182.43697478991595" height="36" rx="3" fill="#c9d9cb" fill-opacity=".9"/><text x="371.21848739495795" y="725" text-anchor="middle" class="l">北宋</text><text x="371.21848739495795" y="752" text-anchor="middle" class="s">960–1127</text><rect x="462.43697478991595" y="700" width="166.0504201680672" height="36" rx="3" fill="#e6c78c" fill-opacity=".9"/><text x="545.4621848739496" y="725" text-anchor="middle" class="l">南宋</text><text x="545.4621848739496" y="752" text-anchor="middle" class="s">1127–1279</text><rect x="619.7478991596638" y="680" width="105.96638655462186" height="36" rx="3" fill="#adc6d5" fill-opacity=".9"/><text x="672.7310924369747" y="705" text-anchor="middle" class="l">元</text><text x="672.7310924369747" y="671" text-anchor="middle" class="s">1271–1368</text><rect x="725.7142857142857" y="700" width="301.51260504201684" height="36" rx="3" fill="#ddb7a5" fill-opacity=".9"/><text x="876.4705882352941" y="725" text-anchor="middle" class="l">明</text><text x="876.4705882352941" y="752" text-anchor="middle" class="s">1368–1644</text><rect x="1027.2268907563025" y="700" width="292.7731092436975" height="36" rx="3" fill="#c9bfd7" fill-opacity=".9"/><text x="1173.6134453781513" y="725" text-anchor="middle" class="l">清</text><text x="1173.6134453781513" y="752" text-anchor="middle" class="s">1644–1912</text><text x="45" y="783" class="s">深綠：地圖1206–1294年範圍。淡色：不同政權的延續；不表示蒙古帝國始終統一或持續擴張。</text><text x="45" y="807" class="s">蒙兀兒王國後來分支、重組；淡色尾端概括察合台後裔支系，非一個統一王國的精確終點。</text></svg>
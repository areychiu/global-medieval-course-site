<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title"><title id="title">不只漢語：不同語系與語族的例子</title><rect width="900" height="510" rx="14" fill="#f3f1e8"/><g font-family="Microsoft JhengHei,sans-serif" fill="#344b43"><text x="30" y="43" font-size="27" font-weight="700">把漢語色塊之外的語言，也放進視野</text><rect x="30" y="70" width="405" height="80" rx="10" fill="white"/><rect x="30" y="70" width="9" height="80" rx="4" fill="#b35f59"/><text x="53" y="100" font-size="23" font-weight="700">漢藏語系</text><text x="53" y="130" font-size="20">漢語、藏語等</text><rect x="465" y="70" width="405" height="80" rx="10" fill="white"/><rect x="465" y="70" width="9" height="80" rx="4" fill="#758d58"/><text x="488" y="100" font-size="23" font-weight="700">蒙古語族</text><text x="488" y="130" font-size="20">蒙古語等</text><rect x="30" y="165" width="405" height="80" rx="10" fill="white"/><rect x="30" y="165" width="9" height="80" rx="4" fill="#a17e51"/><text x="53" y="195" font-size="23" font-weight="700">突厥語族</text><text x="53" y="225" font-size="20">維吾爾語、哈薩克語等</text><rect x="465" y="165" width="405" height="80" rx="10" fill="white"/><rect x="465" y="165" width="9" height="80" rx="4" fill="#a67b9c"/><text x="488" y="195" font-size="23" font-weight="700">通古斯語族</text><text x="488" y="225" font-size="20">滿語等</text><rect x="30" y="260" width="405" height="80" rx="10" fill="white"/><rect x="30" y="260" width="9" height="80" rx="4" fill="#6b9c95"/><text x="53" y="290" font-size="23" font-weight="700">侗台／壯侗語系</text><text x="53" y="320" font-size="20">壯語等</text><rect x="465" y="260" width="405" height="80" rx="10" fill="white"/><rect x="465" y="260" width="9" height="80" rx="4" fill="#578ba5"/><text x="488" y="290" font-size="23" font-weight="700">苗瑤語系</text><text x="488" y="320" font-size="20">苗語、瑤語等</text><rect x="30" y="355" width="405" height="80" rx="10" fill="white"/><rect x="30" y="355" width="9" height="80" rx="4" fill="#b99b4f"/><text x="53" y="385" font-size="23" font-weight="700">南亞語系</text><text x="53" y="415" font-size="20">佤語等</text><rect x="465" y="355" width="405" height="80" rx="10" fill="white"/><rect x="465" y="355" width="9" height="80" rx="4" fill="#987aa6"/><text x="488" y="385" font-size="23" font-weight="700">南島語系</text><text x="488" y="415" font-size="20">臺灣原住民族語言等</text><text x="30" y="472" font-size="17">這是分類例示，不是分布地圖；語系與語族的層級不完全相同。</text><text x="30" y="497" font-size="17">語言親緣不等於族群、血緣或政權疆界，也不表示各地只使用一種語言。</text></g></svg>